# CREEPERMINION — homepage + armory deployment and YouTube refresh.
# IMPORTANT: Settings > Pages > Build and deployment > Source = GitHub Actions.
# Unlike a branch-based Pages build, this deploys explicitly after a bot commit.
name: Publish CreeperMinion site

on:
  push:
    branches: [main]             # Normal website edits still publish automatically.
  schedule:
    - cron: '23 1,7,13,19 * * *' # Four daily checks, times are UTC.
  workflow_dispatch:            # Run manually from the Actions tab.

permissions:
  contents: write               # Commit updated video data if changed.
  pages: write                  # Deploy static site to GitHub Pages.
  id-token: write               # Required by actions/deploy-pages.

concurrency:
  group: creeperminion-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out latest website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh channel data (scheduled/manual runs only)
        if: github.event_name != 'push'
        env:
          # Optional secret for better (duration-based) long-video/Short split.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_youtube.py
      - name: Commit updated feed only when its selection changes
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- content/latest-videos.json; then
            echo "No video changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/latest-videos.json
            git commit -m "Auto-update CreeperMinion homepage videos"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v4
